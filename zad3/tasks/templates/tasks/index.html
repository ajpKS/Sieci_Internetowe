{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista zadań</title>
  <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>
<body>
  <main class="board">
    <header class="header">
      <h1>Lista zadań</h1>
      <p class="summary" aria-live="polite">
        Wszystkie: <strong id="count-total">0</strong>
        <span aria-hidden="true"> · </span>
        Ukończone: <strong id="count-done">0</strong>
      </p>
    </header>

    <form id="task-form" class="add">
      <label for="task-title" class="visually-hidden">
        Nowe zadanie
      </label>
      <input
        id="task-title"
        name="title"
        type="text"
        maxlength="200"
        placeholder="Co jest do zrobienia?"
        autocomplete="off"
        required
      >
      <button type="submit">Dodaj</button>
    </form>

    <p id="message" class="message" role="alert" hidden></p>

    <nav class="filters" aria-label="Pokaż zadania">
      <button type="button" class="filter is-active"
              data-filter="all" aria-pressed="true">
        Wszystkie
      </button>
      <button type="button" class="filter"
              data-filter="active" aria-pressed="false">
        Do zrobienia
      </button>
      <button type="button" class="filter"
              data-filter="completed" aria-pressed="false">
        Ukończone
      </button>
    </nav>

    <ul id="task-list" class="tasks"></ul>
    <p id="empty" class="empty" hidden></p>
  </main>

  <script src="{% static 'tasks/app.js' %}"></script>
</body>
</html>
